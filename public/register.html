<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参加登録</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #232a38;
      background: url("bg.png") center / cover no-repeat fixed;
      min-height: 100dvh;
      padding: 0 24px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.5);
      z-index: 0;
      pointer-events: none;
    }

    .box {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding-top: 110px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      margin: 0 0 8px;
      white-space: nowrap;
      color: #252c3b;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #555d6d;
      margin-bottom: 70px;
    }

    h2 {
      font-size: 1.8rem;
      margin: 0 0 24px;
    }

    input {
      width: 100%;
      height: 68px;
      border-radius: 20px;
      border: 2px solid #ddd;
      padding: 0 18px;
      font-size: 18px;
      margin-bottom: 20px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
    }

    input:focus {
      border-color: #f06f9d;
    }

    button {
      width: 100%;
      height: 64px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #f45f97, #ef6d91);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(239, 110, 145, 0.2);
      margin-bottom: 10px;
    }

    .sub-button {
      background: rgba(255, 255, 255, 0.85);
      color: #555d6d;
      border: 2px solid #ddd;
      box-shadow: none;
    }

    #message {
      min-height: 1.5em;
      font-size: 0.9rem;
      font-weight: 700;
      color: #555d6d;
      margin-top: 8px;
    }

    #rejoinArea {
      display: none;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="title">パーセントバルーン</div>
    <div class="subtitle">参加名を登録してください</div>

    <h2>名前を入力</h2>

    <input id="name" placeholder="名前" maxlength="12" onkeydown="if(event.key==='Enter') start()">

    <button onclick="start()">参加する</button>

    <div id="message"></div>

    <div id="rejoinArea">
      <button onclick="rejoin()">この名前で復帰する</button>
      <button class="sub-button" onclick="changeName()">別の名前にする</button>
    </div>
  </div>

  <script>
    let pendingName = "";

    async function start() {
      const nameInput = document.getElementById("name");
      const message = document.getElementById("message");
      const rejoinArea = document.getElementById("rejoinArea");

      const name = nameInput.value.trim();

      if (!name) {
        message.textContent = "名前を入力してください";
        return;
      }

      const res = await fetch("/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ name })
      });

      const data = await res.json();

      if (data.success) {
        localStorage.setItem("playerName", name);
        location.href = "/";
        return;
      }

      if (data.exists) {
        pendingName = name;
        message.textContent = "この名前は既に登録されています。復帰の場合はそのまま進んでください。";
        rejoinArea.style.display = "block";
        return;
      }

      message.textContent = data.message || "登録できませんでした";
    }

    function rejoin() {
      if (!pendingName) return;
      localStorage.setItem("playerName", pendingName);
      location.href = "index.html";
    }

    function changeName() {
      pendingName = "";
      document.getElementById("message").textContent = "";
      document.getElementById("rejoinArea").style.display = "none";
      document.getElementById("name").focus();
    }
  </script>
</body>
</html>
